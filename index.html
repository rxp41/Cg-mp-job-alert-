<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CG MP Job Alert</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/">CG MP Job Alert</a><a href="/admin.html">Admin Login</a></div></header>
<main class="wrap">
  <section class="hero"><h1>सरकारी और प्राइवेट नौकरी अपडेट</h1><p>छत्तीसगढ़, मध्य प्रदेश और अन्य स्थानों की नौकरियाँ खोजें। आवेदन करने से पहले आधिकारिक वेबसाइट पर विवरण जाँचें।</p></section>
  <section class="filters">
    <input id="q" placeholder="Job title, company या qualification खोजें">
    <select id="state"><option value="">सभी राज्य</option><option>Chhattisgarh</option><option>Madhya Pradesh</option><option>Other</option></select>
    <select id="category"><option value="">सभी प्रकार</option><option>Government</option><option>Private</option></select>
    <button id="search">Search Jobs</button>
  </section>
  <p id="status" role="status"></p><section id="jobs" class="jobs"></section>
</main>
<footer><div class="wrap">यह पोर्टल स्वतंत्र सूचना सेवा है। सभी भर्ती विवरण और अंतिम तिथि आधिकारिक स्रोत से verify करें।</div></footer>
<script src="/main.js" defer></script>
</body></html>
